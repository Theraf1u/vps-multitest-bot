<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>AI Analysis</title>
<style>
  @page {
    size: A4;
    margin: 16mm 14mm;
    @bottom-center {
      content: "AI-анализ · " counter(page) " / " counter(pages);
      font-size: 8pt;
      color: #9aa3af;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: "DejaVu Sans", "Segoe UI", Arial, sans-serif;
    color: #1a1f29;
    font-size: 10.5pt;
    line-height: 1.4;
  }
  h1 { margin: 0 0 4px 0; font-size: 18pt; font-weight: 700; }
  .eyebrow { letter-spacing: 3px; font-size: 9pt; color: #6b7280; margin-bottom: 8px; }
  .meta { font-size: 10pt; color: #374151; margin-bottom: 18px; }
  .meta .row { margin-bottom: 2px; }
  .meta .k { color: #6b7280; }
  .ai-box {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 16px 18px;
    white-space: pre-wrap;
    font-size: 10.5pt;
  }
</style>
</head>
<body>
  <div class="eyebrow">MULTITEST BOT</div>
  <h1>🤖 AI-анализ отчёта</h1>
  <div class="meta">
    <div class="row"><span class="k">Сервер:</span> {{ server_label }}</div>
    <div class="row"><span class="k">Модель:</span> {{ model }}</div>
    <div class="row"><span class="k">Сформировано:</span> {{ generated_at }}</div>
  </div>
  <div class="ai-box">{{ ai_text }}</div>
</body>
</html>
